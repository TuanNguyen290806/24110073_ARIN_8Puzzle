<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-Puzzle - 24110073</title>
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#18202f; --muted:#566178; --line:#d5dce8;
  --accent:#2d55d6; --accent-soft:#e7edfd; --on-accent:#ffffff;
  --goal:#177a4f; --goal-soft:#dff3e9; --warn:#8a4a07; --warn-soft:#fdeed9;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141d; --surface:#172030; --ink:#e7ecf6; --muted:#9aa7bf; --line:#2c3852;
    --accent:#6a8aee; --accent-soft:#1e2b55; --on-accent:#0f141d;
    --goal:#52c88c; --goal-soft:#173a2b; --warn:#f2b266; --warn-soft:#3b2a10; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
.app{max-width:960px;margin:0 auto}
h1{font:600 26px/1.2 var(--font);letter-spacing:-.01em;margin:0}
h2{font:600 12px/1.3 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=text]{width:100%;font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:block;font-weight:500;margin:14px 0 6px}
.cap{color:var(--muted);font-size:12px;margin:0}
.mono{font-family:var(--mono)}
.msg{min-height:18px;margin:4px 0 0;font-size:12px;color:var(--warn)}
.badge{display:block;width:max-content;max-width:100%;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:500;margin:4px 0 12px}
.badge.ok{background:var(--goal-soft);color:var(--goal)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.boards{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-start;margin-bottom:4px}
.boards figure{margin:0}
.boards figcaption{font-weight:500;margin-bottom:8px}
.boards figcaption small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.board{display:grid;grid-template-columns:repeat(3,var(--t));gap:6px;--t:54px;width:max-content}
.board.lg{--t:64px}
.tile{width:var(--t);height:var(--t);display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent);font:500 24px var(--mono);padding:0;color:var(--ink)}
.tile.blank{background:transparent;border:2px dashed var(--line)}
button.tile:disabled{opacity:1;color:var(--ink);cursor:default}
button.tile.movable{cursor:pointer}
button.tile.movable:hover{background:var(--accent);color:var(--on-accent)}
.mini{display:grid;grid-template-columns:repeat(3,26px);gap:1px;background:var(--line);padding:1px;border-radius:3px;width:max-content}
.mini i{font:500 13px/26px var(--mono);font-style:normal;text-align:center;height:26px;background:var(--surface)}
.mini i.z{background:var(--accent-soft)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.controls input[type=range]{flex:1 1 140px;min-width:100px;accent-color:var(--accent)}
.speed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.result{margin:14px 0 0;font-weight:500;min-height:21px}
.result.done{color:var(--goal)}
.result.err{color:var(--warn)}
.moves{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chip{font:500 12px var(--mono);padding:1px 6px;border-radius:4px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.chip.cur{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<div class="app">
  <h1>8-Puzzle BFS</h1>
  <div class="layout">
    <section class="card" aria-labelledby="h-puzzle">
      <h2 id="h-puzzle">Puzzle</h2>
      <div class="boards">
        <figure><figcaption>Start <small>Click a tile next to the blank</small></figcaption><div id="startBoard" class="board"></div></figure>
        <figure><figcaption>Goal</figcaption><div id="goalBoard"></div></figure>
      </div>
      <label class="f" for="tiles">Start tiles, row by row (0 is the blank)</label>
      <input id="tiles" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="tilesMsg">
      <p id="tilesMsg" class="msg" role="status"></p>
      <span id="solv" class="badge"></span>
      <div class="btnrow">
        <button id="shuffle" type="button">Shuffle</button>
        <button id="solve" type="button" class="primary">Solve</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-sol">
      <h2 id="h-sol">Solution</h2>
      <div id="nodeBoard" class="board lg"></div>
      <p id="nodeSub" class="cap mono" style="margin-top:8px"></p>
      <div class="controls">
        <button id="bReset" type="button">Reset</button>
        <button id="bBack" type="button">Back</button>
        <button id="bPlay" type="button" class="primary">Play</button>
        <button id="bStep" type="button">Step</button>
        <button id="bEnd" type="button">Finish</button>
        <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Move">
        <label class="speed">Speed
          <select id="speed">
            <option value="1">1 move/s</option><option value="2" selected>2 moves/s</option>
            <option value="4">4 moves/s</option><option value="8">8 moves/s</option>
          </select>
        </label>
      </div>
      <p id="result" class="result" role="status"></p>
      <div id="moves" class="moves"></div>
    </section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const GOAL = [1, 2, 3, 4, 5, 6, 7, 8, 0];
let start = [1, 2, 3, 4, 0, 6, 7, 5, 8], sol = null, pos = 0, playing = false, timer = 0, req = 0;

const miniHTML = s => '<div class="mini">' + s.map(c => c === 0 ? '<i class="z"></i>' : "<i>" + c + "</i>").join("") + "</div>";
const solvable = s => {
  const t = s.filter(c => c !== 0);
  let inv = 0;
  for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) if (t[i] > t[j]) inv++;
  return inv % 2 === 0;
};
const adjacent = (i, z) => Math.abs(Math.floor(i / 3) - Math.floor(z / 3)) + Math.abs(i % 3 - z % 3) === 1;

function renderStart() {
  const z = start.indexOf(0);
  $("#startBoard").innerHTML = start.map((c, i) => {
    if (c === 0) return '<div class="tile blank" role="img" aria-label="Blank"></div>';
    const adj = adjacent(i, z);
    return '<button type="button" class="tile' + (adj ? " movable" : "") + '" data-i="' + i + '"' + (adj ? "" : " disabled") + ' aria-label="Tile ' + c + (adj ? ", slide into the blank" : "") + '">' + c + "</button>";
  }).join("");
  $("#tiles").value = start.join(" ");
  const ok = solvable(start), b = $("#solv");
  b.className = "badge " + (ok ? "ok" : "warn");
  b.textContent = ok ? "Solvable" : "Unsolvable: BFS will search every reachable state and find nothing.";
}

function show() {
  const n = sol ? sol.moves.length : 0, state = sol ? sol.states[pos] : start;
  $("#nodeBoard").innerHTML = state.map(c => c === 0 ? '<div class="tile blank"></div>' : '<div class="tile">' + c + "</div>").join("");
  $("#nodeSub").textContent = !sol ? "Start" : pos === 0 ? "Start · " + n + " moves" : "Move " + pos + " of " + n + " · blank " + sol.moves[pos - 1].toLowerCase();
  $("#bReset").disabled = $("#bBack").disabled = !sol || pos === 0;
  $("#bStep").disabled = $("#bEnd").disabled = !sol || pos >= n;
  $("#bPlay").disabled = !sol || n === 0;
  $("#bPlay").textContent = playing ? "Pause" : sol && n > 0 && pos >= n ? "Replay" : "Play";
  const sc = $("#scrub"); sc.max = n; sc.value = pos; sc.disabled = !sol || n === 0;
  document.querySelectorAll("#moves .chip").forEach(c => c.classList.toggle("cur", +c.dataset.i === pos));
}

function setResult(text, cls) {
  const el = $("#result");
  el.textContent = text; el.className = "result" + (cls ? " " + cls : "");
}

function clearSolution() {
  clearTimeout(timer); playing = false; sol = null; pos = 0; req++;
  $("#moves").innerHTML = ""; setResult("");
  $("#solve").disabled = false; $("#solve").textContent = "Solve";
}

function setStart(s) { clearSolution(); start = s; $("#tilesMsg").textContent = ""; renderStart(); show(); }

async function solve() {
  clearSolution();
  const id = req, btn = $("#solve");
  btn.disabled = true; btn.textContent = "Solving…"; setResult("Running BFS…");
  try {
    const r = await fetch("/solve?tiles=" + start.join(","));
    const d = await r.json();
    if (id !== req) return;
    if (!r.ok) { setResult(d.error, "err"); return; }
    if (d.moves === null) { setResult("No solution (" + d.seconds.toFixed(2) + " s).", "err"); return; }
    sol = d;
    $("#moves").innerHTML = d.moves.map((m, i) => '<button type="button" class="chip" data-i="' + (i + 1) + '">' + m + "</button>").join("");
    setResult(d.moves.length === 0 ? "Already solved: 0 moves." : "Solved in " + d.moves.length + " moves (" + d.seconds.toFixed(2) + " s).", "done");
  } catch (e) {
    if (id === req) setResult("Can't reach the server. Start it with: python server.py", "err");
  } finally {
    if (id === req) { btn.disabled = false; btn.textContent = "Solve"; show(); }
  }
}

function loop() {
  if (!playing) return;
  pos++;
  if (pos >= sol.moves.length) playing = false;
  show();
  if (playing) timer = setTimeout(loop, 1000 / +$("#speed").value);
}
function togglePlay() {
  if (!sol || !sol.moves.length) return;
  if (playing) { playing = false; clearTimeout(timer); show(); return; }
  if (pos >= sol.moves.length) pos = 0;
  playing = true; show();
  timer = setTimeout(loop, 1000 / +$("#speed").value);
}
function goTo(n) {
  if (!sol) return;
  playing = false; clearTimeout(timer);
  pos = Math.max(0, Math.min(sol.moves.length, n)); show();
}

$("#startBoard").addEventListener("click", e => {
  const b = e.target.closest("button.tile");
  if (!b || b.disabled) return;
  const i = +b.dataset.i, z = start.indexOf(0), t = start.slice();
  t[z] = t[i]; t[i] = 0; setStart(t);
});
$("#tiles").addEventListener("change", e => {
  const v = e.target.value.trim();
  const a = /^\d{9}$/.test(v) ? v.split("").map(Number) : v.split(/[\s,]+/).filter(Boolean).map(Number);
  const bad = a.length !== 9 ? "Enter 9 numbers." : a.some(x => !Number.isInteger(x) || x < 0 || x > 8) ? "Use only the numbers 0 to 8." : new Set(a).size !== 9 ? "Use each number from 0 to 8 exactly once." : "";
  if (bad) { $("#tilesMsg").textContent = bad; e.target.setAttribute("aria-invalid", "true"); return; }
  e.target.removeAttribute("aria-invalid"); setStart(a);
});
$("#shuffle").addEventListener("click", () => {
  let s;
  do { s = GOAL.slice().sort(() => Math.random() - .5); } while (!solvable(s) || s.every((c, i) => c === GOAL[i]));
  setStart(s);
});
$("#solve").addEventListener("click", solve);
$("#bReset").addEventListener("click", () => goTo(0));
$("#bBack").addEventListener("click", () => goTo(pos - 1));
$("#bStep").addEventListener("click", () => goTo(pos + 1));
$("#bEnd").addEventListener("click", () => goTo(sol.moves.length));
$("#bPlay").addEventListener("click", togglePlay);
$("#scrub").addEventListener("input", e => goTo(+e.target.value));
$("#moves").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) goTo(+c.dataset.i); });
document.addEventListener("keydown", e => {
  if (!sol || e.target.closest("input,select,textarea,button")) return;
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); goTo(pos + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(pos - 1); }
});

$("#goalBoard").innerHTML = miniHTML(GOAL);
renderStart();
show();
</script>
</body>
</html>
